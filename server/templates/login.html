<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SanStudio · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;--border:#23232e;
  --accent:#f5a623;--accent2:#e07b1a;--muted:#888899;--text:#e8e8f0;--danger:#e05555;
}
body{
  font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
}
.box{
  width:100%;max-width:360px;background:var(--bg2);
  border:1px solid var(--border);border-radius:16px;padding:32px 28px;
  box-shadow:0 32px 80px rgba(0,0,0,.8);
}
.logo{font-size:1.3rem;font-weight:800;margin-bottom:6px}
.logo span{color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:24px}
input{
  width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-family:'DM Mono',monospace;font-size:.95rem;
  padding:12px 14px;outline:none;margin-bottom:14px;
}
input:focus{border-color:var(--accent)}
button{
  width:100%;padding:12px;border:none;border-radius:8px;cursor:pointer;
  background:var(--accent);color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;
}
button:hover{background:var(--accent2)}
.error{
  color:var(--danger);font-size:.85rem;margin-bottom:14px;
  border-left:3px solid var(--danger);padding-left:10px;
}
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <div class="logo">San<span>Studio</span> Files</div>
    <p class="sub">Enter password to continue</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <input type="password" name="password" placeholder="Password" autofocus required autocomplete="current-password"/>
    <button type="submit">Unlock</button>
  </form>
</body>
</html>
